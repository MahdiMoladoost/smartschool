name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure optional release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$RELEASE_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/codm-test-release.jks" -storepass codmacademy-ci -keypass codmacademy-ci -alias codm-academy -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CODM Academy CI,OU=Android,O=MahdiMoladoost,L=Tehran,C=IR"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/codm-test-release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=codmacademy-ci"
              echo "ANDROID_KEY_ALIAS=codm-academy"
              echo "ANDROID_KEY_PASSWORD=codmacademy-ci"
            } >> "$GITHUB_ENV"
          fi

      - name: Unit tests, lint and release build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleRelease bundleRelease --stacktrace

      - name: Upload installable APK and Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: codm-academy-release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
