<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ورود به سامانه | مدیریت هوشمند مدارس">
    <meta name="theme-color" content="#2563eb">
    <title>ورود | مدیریت هوشمند مدارس</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/public/assets/css/all.min.css">
    
    <!-- Login CSS -->
    <link rel="stylesheet" href="/public/assets/css/home page/login/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-microchip"></i>
            <h1>مدیریت هوشمند</h1>
            <p>سامانه یکپارچه مدیریت آموزشی</p>
        </div>

        <div class="login-body">
            <a href="/" class="back-link">
                <i class="fas fa-arrow-right"></i>
                بازگشت به صفحه اصلی
            </a>

            <div id="messageContainer"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>نام کاربری <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="نام کاربری خود را وارد کنید" autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label>رمز عبور <span class="required">*</span></label>
                    <div class="input-wrapper password-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="رمز عبور خود را وارد کنید">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>مرا به خاطر بسپار</span>
                    </label>
                    <a href="forgot-password.html" class="forgot-link">رمز عبور خود را فراموش کرده‌اید؟</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    ورود به سامانه
                </button>
            </form>

            <div class="register-link">
                <p>حساب کاربری ندارید؟ <a href="/register">ثبت‌نام کنید</a></p>
            </div>

            <div class="demo-accounts">
                <p class="demo-title">حساب‌های آزمایشی:</p>
                <div class="demo-grid">
                    <div class="demo-item" onclick="fillDemo('admin', 'admin123')">
                        <i class="fas fa-user-shield"></i>
                        <span>مدیر: admin / admin123</span>
                    </div>
                    <div class="demo-item" onclick="fillDemo('teacher_rezai', 'teacher123')">
                        <i class="fas fa-chalkboard-user"></i>
                        <span>معلم: teacher_rezai / teacher123</span>
                    </div>
                    <div class="demo-item" onclick="fillDemo('student_ahmadi', 'student123')">
                        <i class="fas fa-user-graduate"></i>
                        <span>دانش‌آموز: student_ahmadi / student123</span>
                    </div>
                    <div class="demo-item" onclick="fillDemo('parent_ahmadi', 'parent123')">
                        <i class="fas fa-user-friends"></i>
                        <span>والدین: parent_ahmadi / parent123</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- Login JS -->
    <script src="/assets/js/login.js"></script>
    
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const icon = document.querySelector('.toggle-password i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function fillDemo(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            const container = document.getElementById('messageContainer');
            container.innerHTML = `
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    <span>اطلاعات ورود تکمیل شد. روی دکمه ورود کلیک کنید.</span>
                </div>
            `;
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }
    </script>
</body>
</html>
