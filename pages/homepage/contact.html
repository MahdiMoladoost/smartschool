function contactApplyMapAddressFront(page={}){

    const mapAddress=String(page.map.address||'').trim();
    if(mapAddress){
        page.methods=(page.methods||[]).map(item=>contactIsAddressMethodFront(item)?{...item,value:mapAddress,link:page.map.button_link||page.map.embed_url||item.link}:item);
    }
    return page;
}
function contactUpdateAddressCardFront(address){

    document.querySelectorAll('[data-contact-address-value]').forEach(el=>{el.textContent=clean;});
}
async function contactResolveAddressFromNeshanFront(){

        const data=await res.json();
        if(data&&data.address) contactUpdateAddressCardFront(data.address);

function renderContact(page=DEFAULT_CONTACT){page=contactApplyMapAddressFront(page);const methods=(page.methods||[]).filter(i=>i.active!==false);contactKicker.textContent=page.hero?.kicker||'راه‌های ارتباطی مدرسه';contactTitle.textContent=page.hero?.title||'ارتباط با ما';contactSubtitle.textContent=page.hero?.subtitle||'';contactCards.innerHTML=methods.map(item=>{const isAddress=/address|آدرس|نشانی|location|map|موقعیت/i.test(String((item.id||'')+' '+(item.title||'')+' '+(item.link||'')));const cardValue=isAddress&&page.map?.address?page.map.address:item.value;const cardLink=isAddress&&(page.map?.button_link||page.map?.embed_url)?(page.map.button_link||page.map.embed_url):(item.link||'#');return `<a class="contact-card" href="${esc(cardLink||'#')}"><span class="contact-card-icon"><i class="fas ${esc(item.icon||'fa-phone')}"></i></span><h3>${esc(item.title)}</h3><strong ${isAddress?'data-contact-address-value':''}>${esc(cardValue)}</strong><p>${esc(item.description)}</p></a>`;}).join('');contactFormTitle.textContent=page.form?.title||'پیام خود را برای ما بفرستید';contactFormSubtitle.textContent=page.form?.subtitle||'';contactFormButton.innerHTML='<i class="fas fa-paper-plane"></i> '+esc(page.form?.button_text||'ارسال پیام');window.contactSuccessText=page.form?.success_text||'پیام شما ثبت شد.';contactHoursTitle.textContent=page.hours?.title||'ساعات پاسخ‌گویی';contactHoursSubtitle.textContent=page.hours?.subtitle||'';contactHours.innerHTML=(page.hours?.items||[]).map(item=>`<div class="contact-hour"><span>${esc(item.day)}</span><span>${esc(item.time)}</span></div>`).join('');contactMapTitle.textContent=page.map?.title||'موقعیت مدرسه';contactMapSubtitle.textContent=page.map?.subtitle||'';const rawMap=String(page.map?.embed_url||'');const iframeMatch=rawMap.match(/src=["']([^"']+)["']/i);const mapEmbed=iframeMatch?iframeMatch[1]:rawMap;const shortMatch=mapEmbed.match(/\/places\/([^#/?]+)/);const derivedNeshan=shortMatch?('https://nshn.ir/'+shortMatch[1]):'';const mapHref=page.map?.button_link||derivedNeshan||mapEmbed||'#';contactMapBox.innerHTML=mapEmbed?`<iframe title="map-iframe" src="${esc(mapEmbed)}" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>`:`<div class="contact-map-fallback"><span class="map-pin"><i class="fas fa-map-location-dot"></i></span><h3>${esc(page.map?.address||'نشانی مدرسه')}</h3><p>برای نمایش نقشه نشان، کد iframe یا لینک iframe نشان را در پنل وارد کنید.</p></div>`;contactSocials.innerHTML=(page.socials||[]).map(item=>{const icon=String(item.icon||'');const iconHtml=icon.startsWith('/')?`<img src="${esc(icon)}" alt="${esc(item.title)}">`:`<i class="fas ${esc(icon||'fa-link')}"></i>`;return `<a href="${esc(item.link||'#')}" target="_blank">${iconHtml}${esc(item.title)}</a>`;}).join('');contactCtaTitle.textContent=page.cta?.title||'آماده پاسخ‌گویی به شما هستیم';contactCtaSubtitle.textContent=page.cta?.subtitle||'';contactCtaButton.href=page.cta?.button_link||'/register';contactCtaButton.innerHTML='<i class="fas fa-user-plus"></i> '+esc(page.cta?.button_text||'شروع ثبت‌نام');}

<script>
function contactPersianDigits(value){
    return String(value||'').replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d];});
}
function setContactFormStatus(type,message,detail){
    const status=document.getElementById('contactFormStatus');
    if(!status)return;
    const icon=type==='success'?'fa-check-circle':type==='error'?'fa-triangle-exclamation':'fa-spinner fa-spin';
    status.className=`contact-form-status show ${type||'info'}`;
    status.innerHTML=`<i class="fas ${icon}"></i><div><strong>${message||''}</strong>${detail?`<span>${detail}</span>`:''}</div>`;
}
async function submitContactMessage(event){
    event.preventDefault();
    const form=event.target;
    const button=form.querySelector('button[type="submit"]');
    const payload={
        full_name:document.getElementById('contactMessageName')?.value?.trim()||'',
        phone:document.getElementById('contactMessagePhone')?.value?.trim()||'',
        subject:document.getElementById('contactMessageSubject')?.value?.trim()||'پیام از صفحه ارتباط با ما',
        message:document.getElementById('contactMessageBody')?.value?.trim()||''
    };
    setContactFormStatus('info','در حال ثبت پیام...','لطفاً چند لحظه صبر کنید.');
    if(button){button.disabled=true;button.style.opacity='.7';}
    try{
        const res=await fetch('/api/v1/public/contact-messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        const data=await res.json().catch(()=>({}));
        if(!res.ok||data.success===false)throw new Error(data.error||data.message||'ثبت پیام انجام نشد');
        setContactFormStatus('success',data.message||window.contactSuccessText||'پیام شما با موفقیت دریافت شد.',data.tracking_code?`کد پیگیری شما: ${data.tracking_code}`:'به‌زودی کارشناسان مدرسه با شما در ارتباط خواهند بود.');
        form.reset();
    }catch(error){
        setContactFormStatus('error',error.message||'خطا در ثبت پیام','لطفاً شماره تماس و متن پیام را بررسی کنید.');
    }finally{
        if(button){button.disabled=false;button.style.opacity='1';}
    }
}
</script>
