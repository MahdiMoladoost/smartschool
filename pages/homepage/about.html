    <style id="about-page-critical-style">

        .about-hero{background:#2563eb;color:#fff;text-align:center;padding:5rem 0 4.6rem}.about-hero h1{font-size:3rem;margin:0 0 1rem;font-weight:950}.about-hero p{margin:0 auto;color:#fff;font-size:1.05rem;font-weight:850}.about-intro-section{padding:5rem 0;background:#f8fafc}.about-intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}.about-intro-content h2{font-size:2.15rem;color:#0f172a;margin:0 0 1.4rem;font-weight:950}.about-intro-text p{color:#64748b;line-height:2.15;margin:0 0 1.1rem;font-size:1.02rem}.about-intro-image img{width:100%;border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,.1);object-fit:cover;display:block}.about-stats-inline{display:flex;gap:2.2rem;margin-top:2rem;flex-wrap:wrap}.about-inline-stat strong{display:block;color:#2563eb;font-size:2.2rem;font-weight:950;line-height:1}.about-inline-stat span{color:#64748b;font-weight:850}.about-sections-section{padding:4rem 0;background:#f8fafc}.about-cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6rem}.about-info-card{position:relative;overflow:hidden;background:#fff;border:1px solid #e2e8f0;border-radius:30px;padding:1.1rem;text-align:right;box-shadow:0 18px 45px rgba(15,23,42,.055);transition:.2s;display:flex;flex-direction:column;min-height:360px}.about-info-card:before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,#2563eb,#22c55e,#f59e0b)}.about-info-card:hover{transform:translateY(-5px);box-shadow:0 24px 55px rgba(15,23,42,.08);border-color:#bfdbfe}.about-info-image{width:100%;height:190px;object-fit:cover;border-radius:22px;margin:0 0 1.05rem;box-shadow:0 16px 34px rgba(15,23,42,.08)}.about-info-icon{display:none!important}.about-info-card h3{color:#0f172a;font-size:1.55rem;font-weight:950;margin:.15rem 0 .85rem}.about-info-card p{color:#64748b;line-height:2;margin:0;font-weight:800}.about-feature-list{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:flex-start;margin-top:1rem}.about-feature-list span{display:inline-flex;align-items:center;gap:.45rem;border:1px solid #e2e8f0;background:#f8fafc;border-radius:16px;padding:.55rem .75rem;color:#334155;font-weight:850;font-size:.85rem}.about-feature-list i{color:#10b981}.about-teachers-section{padding:5rem 0;background:#f8fafc}.about-section-title{text-align:center;margin-bottom:2.6rem}.about-section-title h2{font-size:2.4rem;color:#0f172a;margin:0;font-weight:950}.about-section-title span{display:block;width:86px;height:4px;border-radius:999px;background:linear-gradient(90deg,#f59e0b,#2563eb);margin:1rem auto 1.2rem}.about-section-title p{margin:0;color:#64748b;font-weight:850}.about-section-title p:empty{display:none}.about-section-title p:empty{display:none}.about-teacher-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,320px));justify-content:center;gap:1.5rem;transition:opacity .25s ease}.about-teacher-grid.is-changing{opacity:.25}.about-teacher-card{position:relative;overflow:hidden;background:linear-gradient(180deg,#ffffff 0%,#f8fbff 100%);border:1px solid #dbeafe;border-radius:32px;padding:1.45rem 1.15rem;text-align:center;box-shadow:0 18px 46px rgba(15,23,42,.07);transition:.22s;min-height:330px;display:flex;flex-direction:column;align-items:center}.about-teacher-card:before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,#2563eb,#22c55e)}.about-teacher-card:hover{transform:translateY(-5px);box-shadow:0 26px 60px rgba(37,99,235,.12);border-color:#bfdbfe}.teacher-avatar{width:130px;height:130px;border-radius:32px;margin:.25rem auto 1.05rem;background:linear-gradient(135deg,#eef6ff,#dbeafe);color:#2563eb;border:1px solid #bfdbfe;display:grid;place-items:center;font-size:2.05rem;font-weight:950;overflow:hidden;box-shadow:0 18px 38px rgba(37,99,235,.14)}.teacher-avatar img{width:100%;height:100%;object-fit:cover}.teacher-initials{font-size:1.85rem;font-weight:950;letter-spacing:-.03em}.about-teacher-card h3{margin:0;color:#0f172a;font-size:1.22rem;font-weight:950}.teacher-specialty-pill{display:inline-flex;align-items:center;justify-content:center;color:#2563eb;background:#eff6ff;border:1px solid #dbeafe;border-radius:999px;padding:.42rem .85rem;margin:.72rem 0 .6rem;font-weight:950;font-size:.86rem}.teacher-meta{display:grid;grid-template-columns:1fr;gap:.5rem;width:100%;margin:.25rem 0 .7rem}.teacher-meta span{display:flex;align-items:center;justify-content:center;gap:.42rem;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:.55rem .65rem;color:#475569;font-weight:900;font-size:.82rem}.teacher-meta i{color:#2563eb}.about-teacher-card p{color:#64748b;margin:auto 0 0;font-weight:850;font-size:.86rem;line-height:1.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.about-teachers-actions{display:flex;justify-content:center;margin-top:2rem}.about-all-teachers-btn{display:inline-flex;align-items:center;gap:.55rem;background:#2563eb;color:#fff;text-decoration:none;border-radius:18px;padding:.95rem 1.35rem;font-weight:950;box-shadow:0 14px 28px rgba(37,99,235,.18)}.about-all-teachers-btn:hover{transform:translateY(-2px);color:#fff}.about-cta-section{background:#f8fafc;padding:4rem 0 5rem}.about-cta-box{background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:34px;padding:3.4rem 2rem;text-align:center;color:#fff;position:relative;overflow:hidden}.about-cta-box:after{content:'';position:absolute;top:-90px;right:-70px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.12)}.about-cta-box h2{font-size:2rem;margin:0 0 .8rem}.about-cta-box p{color:#eaf2ff;margin:0 0 1.5rem;font-weight:850}@media(max-width:1000px){.about-intro-grid,.about-cards-grid{grid-template-columns:1fr}.about-teacher-grid{grid-template-columns:repeat(auto-fit,minmax(260px,320px));justify-content:center}.about-hero h1{font-size:2.2rem}.about-stats-inline{justify-content:center}.about-intro-content{text-align:center}}

<body data-page="about">
    <main id="aboutPageRoot">
        <section class="about-hero"><div class="container"><h1 id="aboutHeroTitle">درباره ما</h1><p id="aboutHeroSubtitle">آشنایی با مدیریت هوشمند</p></div></section>

        <section class="about-teachers-section" id="aboutTeachersSection"><div class="container"><div class="about-section-title"><h2 id="aboutStaffTitle">معلمان و کادر دبیرستان</h2><span></span><p id="aboutStaffSubtitle">آشنایی با دبیران و کادر آموزشی مدیریت هوشمند</p></div><div class="about-teacher-grid" id="aboutTeachersGrid"></div><div class="about-teachers-actions"><a class="about-all-teachers-btn" href="/teachers"><i class="fas fa-users"></i> مشاهده تمامی معلمان</a></div></div></section>
        <section class="about-cta-section"><div class="container"><div class="about-cta-box"><h2 id="aboutCtaTitle">به خانواده مدیریت هوشمند بپیوندید</h2><p id="aboutCtaSubtitle">همین امروز ثبت‌نام کنید و آینده فرزندتان را بسازید</p><a id="aboutCtaButton" href="/pages/homepage/auth/register.html" class="btn btn-secondary"><i class="fas fa-pen-fancy"></i> ثبت‌نام آنلاین</a></div></div></section>

    <button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0, behavior:'smooth'})"><i class="fas fa-arrow-up"></i></button>
    <script src="/public/assets/js/aos.js"></script>
    <script src="/public/assets/js/shared-home-layout.js?v=shared-layout-39"></script>
    <script>
    const DEFAULT_ABOUT_PAGE={hero:{title:'درباره ما',subtitle:'آشنایی با مدیریت هوشمند'},intro:{title:'معرفی مدیریت هوشمند',description:'دبیرستان مدیریت هوشمند، یکی از مدارس دولتی شهر تهران است که با هدف ارائه آموزش با کیفیت و پرورش دانش‌آموزان توانمند تأسیس شده است.\nما با بهره‌گیری از معلمان مجرب و امکانات آموزشی مدرن، محیطی امن و پویا برای یادگیری و رشد دانش‌آموزان فراهم کرده‌ایم.\nدر مدیریت هوشمند، ما به هر دانش‌آموز به عنوان یک فرد منحصر به فرد نگاه می‌کنیم و تلاش می‌کنیم استعدادهای آنها را شکوفا کنیم.',image:'/assets/images/about/about-school-collage.jpg',image_alt:'مدرسه مدیریت هوشمند',button_text:'',button_link:''},stats:[],sections:[{id:'vision',title:'چشم انداز',description:'تبدیل شدن به یکی از برترین مدارس دولتی در سطح کشور با رویکرد آموزش خلاقانه و پرورش نسل آینده ساز کشور',icon:'fa-bullseye',features:[]},{id:'mission',title:'رسالت',description:'ارائه آموزش با کیفیت، پرورش استعدادهای فردی و اجتماعی دانش‌آموزان و ایجاد محیطی امن و پویا برای یادگیری',icon:'fa-flag-checkered',features:[]},{id:'values',title:'ارزش‌ها',description:'احترام، صداقت، تعالی، نوآوری و مسئولیت‌پذیری اصولی هستند که ما در دبیرستان فرزانگان به آنها پایبندیم',icon:'fa-gem',features:[]}],staff:{title:'معلمان و کادر دبیرستان',subtitle:'',members:[]},cta:{title:'به خانواده مدیریت هوشمند بپیوندید',subtitle:'همین امروز ثبت‌نام کنید و آینده فرزندتان را بسازید',button_text:'ثبت‌نام آنلاین',button_link:'/pages/homepage/auth/register.html'}};
    function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))} function norm(d){d=d&&typeof d==='object'?d:{};return {hero:{...DEFAULT_ABOUT_PAGE.hero,...(d.hero||{})},intro:{...DEFAULT_ABOUT_PAGE.intro,...(d.intro||{})},stats:Array.isArray(d.stats)?d.stats:DEFAULT_ABOUT_PAGE.stats,sections:Array.isArray(d.sections)?d.sections:DEFAULT_ABOUT_PAGE.sections,staff:{...DEFAULT_ABOUT_PAGE.staff,...(d.staff||{}),members:Array.isArray(d.staff?.members)?d.staff.members:DEFAULT_ABOUT_PAGE.staff.members},cta:{...DEFAULT_ABOUT_PAGE.cta,...(d.cta||{})}}}
    let aboutAllTeachers=[];let aboutTeacherPage=0;let aboutTeacherTimer=null;
    function teacherInitials(name=''){return String(name||'').trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]||'').join('')||'م'}
    function teacherCard(t){return `<article class="about-teacher-card"><div class="teacher-avatar">${t.image?`<img src="${esc(t.image)}" alt="${esc(t.image_alt||t.name)}">`:`<span class="teacher-initials">${esc(teacherInitials(t.name))}</span>`}</div><h3>${esc(t.name)}</h3><span class="teacher-specialty-pill">${esc(t.specialty||t.role||'تخصص ثبت نشده')}</span><div class="teacher-meta"><span><i class="fas fa-medal"></i>${esc(t.experience||'سابقه ثبت نشده')}</span><span><i class="fas fa-graduation-cap"></i>${esc(t.degree||'مدرک ثبت نشده')}</span></div>${t.bio?`<p>${esc(t.bio)}</p>`:''}</article>`}
    function renderTeacherSlice(){const grid=document.getElementById('aboutTeachersGrid');if(!grid)return;const members=aboutAllTeachers||[];const start=(aboutTeacherPage*4)%members.length;const slice=members.length<=4?members:members.slice(start,start+4).concat(members.slice(0,Math.max(0,start+4-members.length)));grid.classList.add('is-changing');setTimeout(()=>{grid.innerHTML=slice.map(teacherCard).join('');grid.classList.remove('is-changing');},160);}
    function setupTeacherCarousel(members){aboutAllTeachers=Array.isArray(members)?members:[];aboutTeacherPage=0;if(aboutTeacherTimer)clearInterval(aboutTeacherTimer);if(aboutTeachersSection)aboutTeachersSection.style.display=aboutAllTeachers.length?'block':'none';renderTeacherSlice();if(aboutAllTeachers.length>4){aboutTeacherTimer=setInterval(()=>{aboutTeacherPage=(aboutTeacherPage+1)%Math.ceil(aboutAllTeachers.length/4);renderTeacherSlice();},5000);}}
    function renderAbout(d){d=norm(d);document.title=(d.hero.title||'درباره ما')+' | مدرسه هوشمند';aboutHeroTitle.textContent=d.hero.title;aboutHeroSubtitle.textContent=d.hero.subtitle;aboutIntroTitle.textContent=d.intro.title;aboutIntroDesc.innerHTML=String(d.intro.description||'').split('\n').filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('');aboutIntroImage.src=d.intro.image||DEFAULT_ABOUT_PAGE.intro.image;aboutIntroImage.alt=d.intro.image_alt||d.intro.title; if(d.intro.button_text){aboutIntroButton.style.display='inline-flex';aboutIntroButton.href=d.intro.button_link||'#';aboutIntroButton.innerHTML='<i class="fas fa-arrow-left"></i> '+esc(d.intro.button_text)}else{aboutIntroButton.style.display='none'} aboutStatsGrid.innerHTML=(d.stats||[]).map(s=>`<div class="about-inline-stat"><strong>${esc(s.value)}</strong><span>${esc(s.label)}</span></div>`).join(''); aboutSectionsGrid.innerHTML=(d.sections||[]).map((s,i)=>`<article class="about-info-card" id="${esc(s.id||('section-'+i))}">${s.image?`<img class="about-info-image" src="${esc(s.image)}" alt="${esc(s.image_alt||s.title)}">`:''}<h3>${esc(s.title)}</h3><p>${esc(s.description)}</p>${Array.isArray(s.features)&&s.features.length?`<div class="about-feature-list">${s.features.map(f=>`<span><i class="fas fa-check-circle"></i>${esc(f)}</span>`).join('')}</div>`:''}</article>`).join(''); const members=Array.isArray(d.staff.members)?d.staff.members:[]; aboutStaffTitle.textContent=d.staff.title; aboutStaffSubtitle.textContent=d.staff.subtitle||''; setupTeacherCarousel(members);aboutCtaTitle.textContent=d.cta.title;aboutCtaSubtitle.textContent=d.cta.subtitle;aboutCtaButton.href=d.cta.button_link||'#';aboutCtaButton.innerHTML='<i class="fas fa-pen-fancy"></i> '+esc(d.cta.button_text||'ثبت‌نام')}
    fetch('/api/v1/public/about-page?_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>renderAbout(j?.content||DEFAULT_ABOUT_PAGE)).catch(()=>renderAbout(DEFAULT_ABOUT_PAGE));window.addEventListener('scroll',()=>document.getElementById('scrollTop')?.classList.toggle('visible',window.scrollY>500));if(window.AOS)AOS.init({duration:800,once:true,offset:100});
    </script>
