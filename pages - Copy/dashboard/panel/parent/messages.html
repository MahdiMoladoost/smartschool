<!-- ============================================ -->

    <div class="nav-menu" id="navMenu">

            </a>
            <a class="nav-item" data-tab="attendance" href="/dashboard/parent/attendance">
                <i class="fas fa-clipboard-check"></i> <span>حضور و غیاب</span>
            </a>
        </div>
        
        <div class="nav-section">
            <div class="nav-section-title">ارتباطات</div>
            <a class="nav-item active" data-tab="messages" href="/dashboard/parent/messages">

    <div class="sidebar-footer">
        <div class="system-info">
            <small><i class="fas fa-server"></i> وضعیت سرور: <span class="status-online">آنلاین</span></small>

        <button class="btn-logout" id="logoutBtn" onclick="logout()">

</div>

<!-- ============================================ -->
<!-- محتوای اصلی -->
<!-- ============================================ -->
<div class="main-content" id="mainContent">

        <div class="page-title">
            <h1><i class="fas fa-chart-line" id="pageIcon"></i> <span id="pageTitle">داشبورد</span></h1>

        </div>
        <div class="header-actions">

                <i class="fas fa-search"></i>
                <input type="text" placeholder="جستجوی سریع..." id="globalSearch">
            </div>
            <div class="btn-icon" onclick="refreshData()" title="بروزرسانی">
                <i class="fas fa-sync-alt"></i>
            </div>
            <div class="btn-icon" id="fullscreenBtn" title="تمام صفحه">
                <i class="fas fa-expand"></i>
            </div>
        </div>
    </div>
    
    <div class="content-area" id="contentArea">
        <div class="loading-content">
            <i class="fas fa-spinner fa-spin"></i>
            <p>در حال بارگذاری...</p>
        </div>
    </div>
</div>

<!-- پنل اعلانات -->
<div class="notification-panel" id="notificationPanel">
    <div class="notification-header">
        <h3><i class="fas fa-bell"></i> اعلانات</h3>
        <button class="btn-icon-sm" onclick="closeNotificationPanel()"><i class="fas fa-times"></i></button>
    </div>
    <div class="notification-list" id="notificationList">
        
    </div>
</div>

<!-- کانتینر توست و مودال‌ها -->
<div class="toast-container" id="toastContainer"></div>
<div id="modalsContainer"></div>

<!-- کتابخانه‌های جانبی -->
<script src="/public/assets/js/jalali-moment.browser.js"></script>
<script src="/public/assets/js/xlsx.full.min.js"></script>

<!-- اسکریپت اصلی پنل والدین -->
<script src="/public/assets/js/parent.js"></script>

<script>
    // اتصال منوها به توابع
    (function() {
        function initManual() {
            if (typeof window.showTab === 'function') {
                const navItems = document.querySelectorAll('.nav-item');
                navItems.forEach(function(item) {
                    if (item.matches('a[href]')) return;
                    item.addEventListener('click', function(e) {
                        e.preventDefault();
                        const tabName = this.getAttribute('data-tab');
                        if (tabName) {
                            window.showTab(tabName);
                        }
                    });
                });
                console.log('✅ منوهای والدین متصل شدند');
            } else {
                setTimeout(initManual, 200);
            }
        }
        initManual();
    })();
</script>
</body>
</html>
